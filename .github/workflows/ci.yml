name: CI

# A single workflow runs on every push and PR. The matrix protects the
# codebase against drift across the three CPython versions we support
# (3.10 is the floor because of PEP 604 union syntax in dungeon/world.py;
# 3.12 is the latest stable at the time of writing).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel any in-flight runs on the same branch when a new push arrives,
# so PR force-pushes don't queue up old commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Cache by lock-ish files; if dev requirements move, the key
          # rotates and we get a fresh wheel cache automatically.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check dungeon tests

      - name: Ruff format check
        run: ruff format --check dungeon tests

      - name: Mypy
        # Best-effort type check; the existing codebase has untyped corners
        # we don't want to fix in this PR. Failure here doesn't fail the
        # job, but it surfaces in the logs so future cleanups have a target.
        continue-on-error: true
        run: mypy dungeon

      - name: Pytest
        # Hypothesis settings are already capped in the test files
        # (max_examples=200 / 100). --no-cov keeps the matrix snappy;
        # the dedicated coverage job below produces the report.
        run: pytest -q --no-cov

  coverage:
    name: coverage (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest --cov=dungeon --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
