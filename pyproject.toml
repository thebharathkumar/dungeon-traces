[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-traces"
version = "0.2.0"
description = "Multi-agent LLM dungeon with belief-vs-truth divergence tracing and failure classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thebharathkumar" }]
keywords = ["llm", "agents", "tracing", "observability", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "types-setuptools",
]

[project.scripts]
dungeon-run = "dungeon.main:main"

[project.urls]
Repository = "https://github.com/thebharathkumar/dungeon-traces"

[tool.setuptools.packages.find]
where = ["."]
include = ["dungeon*"]
exclude = ["tests*", "scripts*", "viewer*", "runs*"]

# ---------- Ruff: lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs", "viewer"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PT",  # flake8-pytest-style
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line-too-long (prompts and docstrings are long on purpose)
    "B008",   # function call in default argument (used for Path defaults via field)
    "SIM108", # ternary preference is sometimes less readable than if/else
    "N806",   # allow CamelCase locals like SYSTEM_PROMPT_TEMPLATE
    "RET504", # let intermediate vars stand for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011"]  # bare assert and broad pytest.raises are fine in tests
"scripts/**" = ["E402"]         # path manipulation before imports is intentional

[tool.ruff.lint.isort]
known-first-party = ["dungeon"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy: pragmatic strict ----------
[tool.mypy]
python_version = "3.10"
files = ["dungeon", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true
# Pragmatic: the codebase uses Any deliberately at LLM-SDK boundaries and at
# the trace-sink Protocol, where strict typing fights the dynamism.
disallow_any_generics = false
strict_equality = false

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "langfuse", "langfuse.*", "dotenv"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false  # pytest fixtures and parametrize cases are looser

# ---------- Pytest + Hypothesis + Coverage ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=dungeon",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: tests that take more than a second",
    "property: hypothesis-driven property tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:langfuse.*",
]

[tool.coverage.run]
source = ["dungeon"]
branch = true
omit = ["dungeon/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
skip_covered = false
show_missing = true
