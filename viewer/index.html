<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dungeon Agents: Trace Viewer</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg-raised: #161922;
      --bg-sunken: #0a0c11;
      --border: #262a36;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --text-mute: #6b7280;
      --green: #4ade80;
      --amber: #f5a524;
      --red: #f87171;
      --blue: #60a5fa;
      --violet: #a78bfa;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
    }
    .page {
      width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 4px 0;
      letter-spacing: 0.3px;
    }
    h1 .accent { color: var(--violet); }
    .sub {
      color: var(--text-mute);
      font-size: 11px;
      margin-bottom: 14px;
    }

    /* ----- Summary bar ----- */
    .summary {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .summary-row {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .summary-row + .summary-row { margin-top: 10px; }
    .loader {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .loader label {
      background: #1f2433;
      border: 1px solid #2e3346;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--sans);
    }
    .loader label:hover { background: #242a3c; }
    .loader input[type=file] { display: none; }
    .loader .filename {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
    }
    .facts {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 12px;
    }
    .fact { display: flex; gap: 6px; align-items: baseline; }
    .fact .label {
      color: var(--text-mute);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .fact .value { color: var(--text); }
    .fact .value.status-success { color: var(--green); }
    .fact .value.status-timeout { color: var(--amber); }
    .fact .value.status-stuck { color: var(--red); }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-sunken);
      font-family: var(--mono);
      font-size: 11px;
    }
    .chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-mute);
    }
    .chip .count { color: var(--text); font-weight: 600; }
    .chip .name { color: var(--text-dim); }
    .chip.success .dot      { background: var(--green); }
    .chip.agent_error .dot  { background: var(--red); }
    .chip.information_lag .dot { background: var(--amber); }
    .chip.coordination_failure .dot { background: var(--violet); }
    .chip.environment_constraint .dot { background: var(--blue); }

    /* ----- Main content grid (timeline | detail, heatmap full width) ----- */
    .grid {
      display: grid;
      grid-template-columns: 520px 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .panel {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-mute);
    }
    .panel-body {
      padding: 14px;
      max-height: 640px;
      overflow: auto;
    }
    .panel-body.timeline-body { padding: 0; }
    .placeholder {
      color: var(--text-mute);
      font-size: 12px;
      text-align: center;
      padding: 40px 14px;
    }

    .heatmap-panel .panel-body { padding: 14px; }

    /* ----- Timeline ----- */
    .timeline-body { max-height: 640px; overflow-y: auto; outline: none; }
    .row {
      display: grid;
      grid-template-columns: 40px 28px 1fr 14px;
      align-items: center;
      gap: 10px;
      height: 22px;
      padding: 0 12px;
      font-family: var(--mono);
      font-size: 11px;
      border-left: 3px solid transparent;
      cursor: pointer;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .row:hover { background: rgba(255,255,255,0.02); }
    .row .turn { color: var(--text-mute); }
    .row .agent {
      font-weight: 700;
      text-align: center;
    }
    .row .agent.A { color: var(--blue); }
    .row .agent.B { color: var(--violet); }
    .row .action {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .row .action .tool { color: var(--text); }
    .row .action .args { color: var(--text-mute); }
    .row .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-mute);
      justify-self: end;
    }
    .row .dot.match     { background: var(--green); }
    .row .dot.diverged  { background: var(--red); }
    .row .dot.stale     { background: var(--amber); }
    .row .dot.unknown   { background: var(--text-mute); }

    .row.cls-agent_error          { background: rgba(248,113,113,0.08); border-left-color: var(--red); }
    .row.cls-information_lag      { background: rgba(245,165,36,0.09); border-left-color: var(--amber); }
    .row.cls-coordination_failure { background: rgba(167,139,250,0.10); border-left-color: var(--violet); }
    .row.cls-environment_constraint { background: rgba(96,165,250,0.08); border-left-color: var(--blue); }

    .row.selected {
      background: #1c2230 !important;
      border-left-color: var(--text) !important;
    }

    /* ----- Detail panel ----- */
    .detail-section { margin-bottom: 18px; }
    .detail-section:last-child { margin-bottom: 0; }
    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-mute);
      margin-bottom: 6px;
    }
    .detail-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .detail-meta .agent-tag {
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 3px;
      background: var(--bg-sunken);
    }
    .detail-meta .agent-tag.A { color: var(--blue); }
    .detail-meta .agent-tag.B { color: var(--violet); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pill.success             { background: rgba(74,222,128,0.15); color: var(--green); }
    .pill.agent_error         { background: rgba(248,113,113,0.15); color: var(--red); }
    .pill.information_lag     { background: rgba(245,165,36,0.15); color: var(--amber); }
    .pill.coordination_failure { background: rgba(167,139,250,0.15); color: var(--violet); }
    .pill.environment_constraint { background: rgba(96,165,250,0.15); color: var(--blue); }

    .bvt-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 11px;
    }
    .bvt-table th, .bvt-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .bvt-table th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-mute);
      font-weight: 500;
    }
    .bvt-table tr.fact-diverged td {
      background: rgba(245,165,36,0.06);
    }
    .bvt-table tr.fact-diverged td.field-name {
      border-left: 3px solid var(--amber);
      padding-left: 8px;
    }
    .bvt-table tr.fact-unknown td { color: var(--text-mute); }
    .bvt-table td.actual-diverged { color: var(--red); }
    .bvt-table .age { color: var(--text-mute); font-size: 10px; }
    .bvt-table .caused-by {
      display: block;
      color: var(--violet);
      font-size: 10px;
      margin-top: 2px;
    }

    .reasoning {
      font-family: var(--sans);
      font-style: italic;
      color: var(--text-dim);
      line-height: 1.5;
      padding: 10px 12px;
      background: var(--bg-sunken);
      border-left: 2px solid var(--border);
      border-radius: 3px;
      font-size: 12px;
    }
    .action-line {
      font-family: var(--mono);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-line .tool { color: var(--text); font-weight: 600; }
    .action-line .args { color: var(--text-dim); }
    .action-line .outcome.ok { color: var(--green); }
    .action-line .outcome.fail { color: var(--red); }

    .raw-json {
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow: auto;
    }

    .msg-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-family: var(--mono);
      font-size: 11px;
    }
    .msg-list li {
      padding: 6px 10px;
      background: var(--bg-sunken);
      border-left: 2px solid var(--border);
      border-radius: 3px;
      margin-bottom: 4px;
      color: var(--text-dim);
    }
    .msg-list li .who { color: var(--text); font-weight: 600; }
    .msg-list li .when { color: var(--text-mute); }

    /* ----- Heatmap ----- */
    .heatmap {
      display: grid;
      grid-template-columns: 28px 1fr;
      row-gap: 6px;
      column-gap: 10px;
      align-items: center;
    }
    .heatmap .row-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      color: var(--text-mute);
    }
    .heatmap .row-label.A { color: var(--blue); }
    .heatmap .row-label.B { color: var(--violet); }
    .heatmap-row {
      display: grid;
      gap: 2px;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
    }
    .heatmap-cell {
      height: 22px;
      border-radius: 2px;
      background: #1a1f2c;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .heatmap-cell:hover { border-color: var(--text-dim); }
    .heatmap-cell.sev-0 { background: #1a1f2c; }
    .heatmap-cell.sev-1 { background: rgba(245,165,36,0.55); }
    .heatmap-cell.sev-2 { background: rgba(248,113,113,0.75); }
    .heatmap-cell.cls-agent_error            { background: rgba(248,113,113,0.30); }
    .heatmap-cell.cls-environment_constraint { background: rgba(96,165,250,0.30); }
    .heatmap-cell.cls-information_lag.sev-0  { background: rgba(245,165,36,0.35); }
    .heatmap-cell.cls-coordination_failure.sev-0 { background: rgba(167,139,250,0.45); }
    .heatmap-cell.selected {
      outline: 2px solid var(--text);
      outline-offset: -1px;
    }
    .heatmap-axis {
      grid-column: 2 / 3;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 2px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-mute);
      text-align: center;
      margin-top: 4px;
    }
    .heatmap-legend {
      display: flex;
      gap: 14px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-mute);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .heatmap-legend .sw {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Dungeon Agents <span class="accent">Trace Viewer</span></h1>
    <div class="sub">Belief vs truth, divergence age, and failure classification for every agent step.</div>

    <div class="summary">
      <div class="summary-row">
        <div class="loader">
          <label for="ndjson-input">Load NDJSON</label>
          <input id="ndjson-input" type="file" accept=".ndjson,application/x-ndjson,application/json,text/plain" />
          <span class="filename" id="filename">no file loaded</span>
        </div>
        <div class="facts" id="facts"></div>
      </div>
      <div class="summary-row">
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">Turn timeline</div>
        <div class="panel-body timeline-body" id="timeline">
          <div class="placeholder">Load an NDJSON file to see turns.</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">Event detail</div>
        <div class="panel-body" id="detail">
          <div class="placeholder">Select a turn on the left.</div>
        </div>
      </div>
    </div>

    <div class="panel heatmap-panel">
      <div class="panel-header">Belief divergence heatmap</div>
      <div class="panel-body" id="heatmap">
        <div class="placeholder">Heatmap will render once a run is loaded.</div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // ------- State -------
    const state = {
      events: [],
      filename: null,
      selectedIndex: -1,
    };

    const FACT_KEYS = [
      { id: "key_position",        belief: "last_known_key_position",     label: "key_position" },
      { id: "door_locked",         belief: "last_known_door_locked",      label: "door_locked" },
      { id: "other_agent_position", belief: "last_known_other_position",  label: "other_agent_position" },
    ];

    const CLASSIFICATIONS = [
      "success",
      "agent_error",
      "information_lag",
      "coordination_failure",
      "environment_constraint",
    ];

    // ------- Elements -------
    const el = {
      input: document.getElementById("ndjson-input"),
      filename: document.getElementById("filename"),
      facts: document.getElementById("facts"),
      chips: document.getElementById("chips"),
      timeline: document.getElementById("timeline"),
      detail: document.getElementById("detail"),
      heatmap: document.getElementById("heatmap"),
    };

    // ------- File loading -------
    el.input.addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const events = parseNdjson(String(reader.result || ""));
          state.events = events;
          state.filename = file.name;
          state.selectedIndex = events.length > 0 ? 0 : -1;
          render();
        } catch (err) {
          state.events = [];
          state.filename = file.name + " (parse error)";
          state.selectedIndex = -1;
          render();
          console.error(err);
          alert("Failed to parse NDJSON: " + err.message);
        }
      };
      reader.readAsText(file);
    });

    function parseNdjson(text) {
      const out = [];
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        try {
          out.push(JSON.parse(line));
        } catch (err) {
          throw new Error("line " + (i + 1) + ": " + err.message);
        }
      }
      return out;
    }

    // ------- Summary computation -------
    function summarize(events) {
      if (events.length === 0) return null;
      const first = events[0];
      const last = events[events.length - 1];
      const counts = {};
      CLASSIFICATIONS.forEach(function (c) { counts[c] = 0; });
      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        const key = e.failure_classification || "success";
        counts[key] = (counts[key] || 0) + 1;
      }
      const status =
        (last.world_truth_state && last.world_truth_state.status) || "unknown";
      const turnsPlayed = last.turn != null ? last.turn + 1 : 0;
      const runId = first.run_id || "(unknown)";
      const timestamp = first.timestamp || "";
      return {
        runId: runId,
        status: status,
        turns: turnsPlayed,
        timestamp: timestamp,
        counts: counts,
        total: events.length,
      };
    }

    // ------- Rendering -------
    function render() {
      el.filename.textContent = state.filename || "no file loaded";
      const s = summarize(state.events);
      renderFacts(s);
      renderChips(s);
      renderTimeline();
      renderDetail();
      renderHeatmap();
    }

    function renderFacts(s) {
      if (!s) {
        el.facts.innerHTML = "";
        return;
      }
      const statusClass = "status-" + s.status;
      el.facts.innerHTML =
        fact("run", s.runId) +
        fact("status", s.status, statusClass) +
        fact("turns", String(s.turns)) +
        fact("events", String(s.total)) +
        fact("started", shortTimestamp(s.timestamp));
    }

    function fact(label, value, extraClass) {
      const cls = "value" + (extraClass ? " " + extraClass : "");
      return (
        '<div class="fact">' +
        '<span class="label">' + escapeHtml(label) + "</span>" +
        '<span class="' + cls + '">' + escapeHtml(value) + "</span>" +
        "</div>"
      );
    }

    function shortTimestamp(ts) {
      if (!ts) return "";
      // Drop sub-second precision and trailing zone for compactness.
      return ts.replace(/\.\d+/, "").replace("+00:00", "Z");
    }

    function renderChips(s) {
      if (!s) {
        el.chips.innerHTML = "";
        return;
      }
      const parts = CLASSIFICATIONS.map(function (name) {
        const count = s.counts[name] || 0;
        return (
          '<span class="chip ' + name + '">' +
          '<span class="dot"></span>' +
          '<span class="count">' + count + "</span>" +
          '<span class="name">' + name + "</span>" +
          "</span>"
        );
      });
      el.chips.innerHTML = parts.join("");
    }

    // ------- Timeline rendering -------
    function renderTimeline() {
      if (state.events.length === 0) {
        el.timeline.innerHTML = '<div class="placeholder">Load an NDJSON file to see turns.</div>';
        return;
      }
      const rows = state.events.map(function (e, i) {
        const cls = e.failure_classification || "success";
        const selected = i === state.selectedIndex ? " selected" : "";
        const tool = (e.action_taken && e.action_taken.tool_name) || "(no tool)";
        const args = formatArgs(e.action_taken && e.action_taken.tool_input);
        const dotClass = overallDotClass(e);
        const turn = e.turn != null ? String(e.turn).padStart(2, "0") : "--";
        const aid = e.agent_id || "?";
        return (
          '<div class="row cls-' + cls + selected + '" data-index="' + i + '">' +
            '<div class="turn">' + escapeHtml(turn) + "</div>" +
            '<div class="agent ' + aid + '">' + escapeHtml(aid) + "</div>" +
            '<div class="action"><span class="tool">' + escapeHtml(tool) + "</span>" +
              (args ? '<span class="args">(' + escapeHtml(args) + ")</span>" : "") +
            "</div>" +
            '<div class="dot ' + dotClass + '"></div>' +
          "</div>"
        );
      });
      el.timeline.innerHTML = rows.join("");
    }

    function overallDotClass(e) {
      const acc = e.belief_accuracy || {};
      const vals = Object.keys(acc).map(function (k) { return acc[k]; });
      if (vals.indexOf("diverged") >= 0) return "diverged";
      if (vals.length === 0) return "unknown";
      const allUnknown = vals.every(function (v) { return v === "unknown"; });
      if (allUnknown) return "unknown";
      return "match";
    }

    function formatArgs(input) {
      if (!input || typeof input !== "object") return "";
      const keys = Object.keys(input);
      if (keys.length === 0) return "";
      return keys.map(function (k) {
        const v = input[k];
        let s = typeof v === "string" ? v : JSON.stringify(v);
        if (s && s.length > 30) s = s.slice(0, 27) + "...";
        return k + "=" + s;
      }).join(", ");
    }

    // Timeline click + keyboard selection.
    el.timeline.addEventListener("click", function (e) {
      const row = e.target.closest(".row");
      if (!row) return;
      const i = parseInt(row.getAttribute("data-index"), 10);
      if (isNaN(i)) return;
      selectIndex(i, false);
    });

    document.addEventListener("keydown", function (e) {
      if (state.events.length === 0) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.key === "ArrowDown" || e.key === "j") {
        e.preventDefault();
        selectIndex(Math.min(state.events.length - 1, state.selectedIndex + 1), true);
      } else if (e.key === "ArrowUp" || e.key === "k") {
        e.preventDefault();
        selectIndex(Math.max(0, state.selectedIndex - 1), true);
      } else if (e.key === "Home") {
        e.preventDefault();
        selectIndex(0, true);
      } else if (e.key === "End") {
        e.preventDefault();
        selectIndex(state.events.length - 1, true);
      }
    });

    function selectIndex(i, scroll) {
      if (i < 0 || i >= state.events.length) return;
      state.selectedIndex = i;
      // Update timeline row selection in place to avoid re-rendering.
      const rows = el.timeline.querySelectorAll(".row");
      for (let r = 0; r < rows.length; r++) rows[r].classList.remove("selected");
      const row = el.timeline.querySelector('.row[data-index="' + i + '"]');
      if (row) {
        row.classList.add("selected");
        if (scroll) {
          row.scrollIntoView({ block: "nearest" });
        }
      }
      // Update heatmap cell selection in place.
      const cells = el.heatmap.querySelectorAll(".heatmap-cell");
      for (let c = 0; c < cells.length; c++) cells[c].classList.remove("selected");
      const cell = el.heatmap.querySelector('.heatmap-cell[data-index="' + i + '"]');
      if (cell) cell.classList.add("selected");
      renderDetail();
    }

    // ------- Detail panel rendering -------
    function renderDetail() {
      if (state.selectedIndex < 0 || !state.events[state.selectedIndex]) {
        el.detail.innerHTML = '<div class="placeholder">Select a turn on the left.</div>';
        return;
      }
      const e = state.events[state.selectedIndex];
      const cls = e.failure_classification || "success";
      const tool = (e.action_taken && e.action_taken.tool_name) || "(no tool)";
      const args = formatArgs(e.action_taken && e.action_taken.tool_input);
      const aid = e.agent_id || "?";
      const succeeded = !!e.action_succeeded;

      const metaHtml =
        '<div class="detail-meta">' +
          '<span class="agent-tag ' + aid + '">Agent ' + escapeHtml(aid) + "</span>" +
          '<span>turn ' + escapeHtml(String(e.turn)) + "</span>" +
          '<span>lat ' + escapeHtml(String((e.latency_ms && e.latency_ms.total) || 0)) + "ms</span>" +
          (e.usage ? '<span>tokens ' + (e.usage.input_tokens || 0) + " / " + (e.usage.output_tokens || 0) + "</span>" : "") +
          "</div>";

      const actionHtml =
        '<div class="detail-section">' +
          '<div class="detail-label">Action</div>' +
          '<div class="action-line">' +
            '<span class="tool">' + escapeHtml(tool) + "</span>" +
            (args ? '<span class="args">(' + escapeHtml(args) + ")</span>" : '<span class="args">()</span>') +
            '<span class="outcome ' + (succeeded ? "ok" : "fail") + '">' + (succeeded ? "ok" : "noop") + "</span>" +
            '<span class="pill ' + cls + '">' + cls.replace(/_/g, " ") + "</span>" +
          "</div>" +
        "</div>";

      const bvtHtml =
        '<div class="detail-section">' +
          '<div class="detail-label">Belief vs truth</div>' +
          renderBvtTable(e) +
        "</div>";

      const reasoningHtml = e.reasoning
        ? '<div class="detail-section">' +
            '<div class="detail-label">Reasoning</div>' +
            '<div class="reasoning">' + escapeHtml(e.reasoning) + "</div>" +
          "</div>"
        : "";

      const msgHtml = renderMessagesBlock(e);

      const rawHtml =
        '<div class="detail-section">' +
          '<div class="detail-label">Raw action_result</div>' +
          '<div class="raw-json">' + escapeHtml(JSON.stringify(e.action_result || {}, null, 2)) + "</div>" +
        "</div>";

      el.detail.innerHTML = metaHtml + actionHtml + bvtHtml + reasoningHtml + msgHtml + rawHtml;
    }

    function renderBvtTable(e) {
      const belief = e.agent_belief_state || {};
      const truth = e.world_truth_state || {};
      const accuracy = e.belief_accuracy || {};
      const divergences = e.divergences || [];
      const divByField = {};
      divergences.forEach(function (d) { divByField[d.field] = d; });

      const selfId = belief.self_id;
      const otherId = findOtherAgent(selfId, truth);

      const rows = FACT_KEYS.map(function (f) {
        const state = accuracy[f.id] || "unknown";
        const believed = belief[f.belief];
        const actual = actualValueForFact(f.id, selfId, otherId, truth);
        const d = divByField[f.id];
        let rowClass = "";
        if (state === "diverged") rowClass = "fact-diverged";
        else if (state === "unknown") rowClass = "fact-unknown";

        const believedStr = formatValue(believed);
        const actualStr = formatValue(actual);
        const ageTxt = d && d.divergence_age != null
          ? '(stale ' + d.divergence_age + (d.divergence_age === 1 ? " turn" : " turns") + ")"
          : "";
        const causedBy = d && d.caused_by_agent && d.caused_by_agent !== selfId
          ? '<span class="caused-by">caused by ' + escapeHtml(d.caused_by_agent) +
            (d.caused_at_turn != null ? " on turn " + d.caused_at_turn : "") +
            (d.caused_change ? " (" + escapeHtml(d.caused_change) + ")" : "") +
            "</span>"
          : "";
        const actualCls = state === "diverged" ? "actual-diverged" : "";
        return (
          '<tr class="' + rowClass + '">' +
            '<td class="field-name">' + escapeHtml(f.label) + "</td>" +
            "<td>" + escapeHtml(believedStr) + "</td>" +
            '<td class="' + actualCls + '">' + escapeHtml(actualStr) +
              (ageTxt ? ' <span class="age">' + escapeHtml(ageTxt) + "</span>" : "") +
              causedBy +
            "</td>" +
          "</tr>"
        );
      });

      return (
        '<table class="bvt-table">' +
          "<thead><tr>" +
            "<th>field</th>" +
            "<th>believed</th>" +
            "<th>actual</th>" +
          "</tr></thead>" +
          "<tbody>" + rows.join("") + "</tbody>" +
        "</table>"
      );
    }

    function findOtherAgent(selfId, truth) {
      const positions = (truth && truth.agent_positions) || {};
      const ids = Object.keys(positions);
      for (let i = 0; i < ids.length; i++) {
        if (ids[i] !== selfId) return ids[i];
      }
      return null;
    }

    function actualValueForFact(factId, selfId, otherId, truth) {
      if (factId === "key_position") {
        const holder = truth.key_holder;
        if (holder === selfId) return "in_my_inventory";
        if (holder != null) return "in_partner_inventory";
        if (truth.key_position) return truth.key_position;
        return "unknown";
      }
      if (factId === "door_locked") {
        return truth.door_locked;
      }
      if (factId === "other_agent_position") {
        if (otherId && truth.agent_positions && truth.agent_positions[otherId]) {
          return truth.agent_positions[otherId];
        }
        return "unknown";
      }
      return "unknown";
    }

    function formatValue(v) {
      if (v === true) return "true";
      if (v === false) return "false";
      if (v == null) return "unknown";
      if (Array.isArray(v)) {
        if (v.length === 2 && typeof v[0] === "number") return "(" + v[0] + ", " + v[1] + ")";
        return JSON.stringify(v);
      }
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    function renderMessagesBlock(e) {
      const ctx = e.message_context || {};
      const received = ctx.received_preview || [];
      const sent = ctx.sent_this_turn || [];
      if (received.length === 0 && sent.length === 0) return "";
      const items = [];
      received.forEach(function (m) {
        items.push(
          "<li>" +
            '<span class="who">from ' + escapeHtml(m.sender || "?") + "</span> " +
            '<span class="when">[sent turn ' + (m.sent_turn != null ? m.sent_turn : "?") + "]</span> " +
            escapeHtml(m.content || "") +
          "</li>"
        );
      });
      sent.forEach(function (m) {
        items.push(
          "<li>" +
            '<span class="who">to ' + escapeHtml(m.recipient || "?") + "</span> " +
            '<span class="when">[delivers turn ' + (m.deliver_turn != null ? m.deliver_turn : "?") + "]</span> " +
            escapeHtml(m.content || "") +
          "</li>"
        );
      });
      return (
        '<div class="detail-section">' +
          '<div class="detail-label">Messages</div>' +
          '<ul class="msg-list">' + items.join("") + "</ul>" +
        "</div>"
      );
    }

    // ------- Heatmap rendering -------
    function renderHeatmap() {
      if (state.events.length === 0) {
        el.heatmap.innerHTML = '<div class="placeholder">Heatmap will render once a run is loaded.</div>';
        return;
      }
      // Build agent -> turn -> event index map.
      const agentIds = [];
      const byAgent = {};
      let maxTurn = 0;
      for (let i = 0; i < state.events.length; i++) {
        const e = state.events[i];
        const aid = e.agent_id || "?";
        if (!byAgent[aid]) {
          byAgent[aid] = {};
          agentIds.push(aid);
        }
        byAgent[aid][e.turn] = i;
        if (typeof e.turn === "number" && e.turn > maxTurn) maxTurn = e.turn;
      }
      agentIds.sort();

      const turnCount = maxTurn + 1;
      const rowsHtml = agentIds.map(function (aid) {
        const cells = [];
        for (let t = 0; t < turnCount; t++) {
          const idx = byAgent[aid][t];
          if (idx == null) {
            cells.push('<div class="heatmap-cell sev-0" title="no action"></div>');
            continue;
          }
          const e = state.events[idx];
          const divCount = (e.divergence_fields || []).length;
          let sev = "sev-0";
          if (divCount === 1) sev = "sev-1";
          else if (divCount >= 2) sev = "sev-2";
          const cls = e.failure_classification || "success";
          const clsAttr = cls === "success" ? "" : " cls-" + cls;
          const selected = idx === state.selectedIndex ? " selected" : "";
          cells.push(
            '<div class="heatmap-cell ' + sev + clsAttr + selected + '" ' +
              'data-index="' + idx + '" ' +
              'title="turn ' + t + " " + aid + " - " +
              (e.action_taken && e.action_taken.tool_name || "?") +
              (divCount > 0 ? " [" + (e.divergence_fields || []).join(",") + "]" : "") +
              (cls !== "success" ? " (" + cls + ")" : "") +
            '"></div>'
          );
        }
        return (
          '<div class="row-label ' + aid + '">' + escapeHtml(aid) + "</div>" +
          '<div class="heatmap-row">' + cells.join("") + "</div>"
        );
      });

      // Turn axis: tick every 5 turns.
      const axisCells = [];
      for (let t = 0; t < turnCount; t++) {
        const label = (t % 5 === 0 || t === turnCount - 1) ? String(t) : "";
        axisCells.push('<div>' + label + "</div>");
      }

      const legendHtml =
        '<div class="heatmap-legend">' +
          '<span><span class="sw" style="background:#1a1f2c;border:1px solid #262a36"></span>0 diverged fields</span>' +
          '<span><span class="sw" style="background:rgba(245,165,36,0.55)"></span>1 diverged field</span>' +
          '<span><span class="sw" style="background:rgba(248,113,113,0.75)"></span>2+ diverged fields</span>' +
          '<span><span class="sw" style="background:rgba(248,113,113,0.30)"></span>agent_error</span>' +
          '<span><span class="sw" style="background:rgba(96,165,250,0.30)"></span>environment_constraint</span>' +
        "</div>";

      el.heatmap.innerHTML =
        '<div class="heatmap">' +
          rowsHtml.join("") +
          '<div></div>' +
          '<div class="heatmap-axis">' + axisCells.join("") + "</div>" +
        "</div>" +
        legendHtml;
    }

    // Clicking a heatmap cell jumps the timeline to that event.
    el.heatmap.addEventListener("click", function (e) {
      const cell = e.target.closest(".heatmap-cell");
      if (!cell) return;
      const i = parseInt(cell.getAttribute("data-index"), 10);
      if (isNaN(i)) return;
      selectIndex(i, true);
      // Re-render heatmap so the selected cell outline updates.
      renderHeatmap();
    });

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    render();
  })();
  </script>
</body>
</html>
